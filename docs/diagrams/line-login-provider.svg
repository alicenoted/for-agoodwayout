<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
<defs><style>text{font-family:"PingFang TC","Noto Sans TC","WenQuanYi Zen Hei",sans-serif}</style>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17324d" flood-opacity=".12"/></filter></defs>
<rect width="1400" height="860" fill="#f6f8f7" rx="24"/>
<text x="60" y="70" font-size="32" font-weight="700" fill="#18364b">LINE 怎麼「認人」？</text>
<text x="60" y="106" font-size="18" fill="#607789">LINE 會給每個人一個「會員編號」，但不同資料夾（Provider）給的編號不一樣</text>
<text x="60" y="170" font-size="22" font-weight="700" fill="#18364b">現在（測試用）</text><rect x="60" y="220" width="300" height="200" rx="18" fill="#f8f0e5" stroke="#a67c35" stroke-width="2" stroke-dasharray="8 6"/><rect x="80" y="202" width="163" height="36" rx="10" fill="#a67c35"/><text x="98" y="226" font-size="18" font-weight="700" fill="#fff">📁 出走社測試</text><rect x="85" y="260" width="250" height="120" rx="14" fill="#fff" stroke="#dfe7ea" filter="url(#sh)"/><text x="105" y="296" font-size="19" font-weight="700" fill="#18364b">活動接龍網站</text><text x="105" y="322" font-size="14" fill="#607789">登入用</text><rect x="105" y="336" width="210" height="30" rx="15" fill="#a67c3522"/><text x="210" y="357" font-size="15" font-weight="700" fill="#a67c35" text-anchor="middle">小美 = 編號 A123</text><rect x="380" y="220" width="300" height="200" rx="18" fill="#e8f2f4" stroke="#2f6f7e" stroke-width="2" stroke-dasharray="8 6"/><rect x="400" y="202" width="201" height="36" rx="10" fill="#2f6f7e"/><text x="418" y="226" font-size="18" font-weight="700" fill="#fff">📁 出走社（正式）</text><rect x="405" y="260" width="250" height="120" rx="14" fill="#fff" stroke="#dfe7ea" filter="url(#sh)"/><text x="425" y="296" font-size="19" font-weight="700" fill="#18364b">出走社官方帳號</text><text x="425" y="322" font-size="14" fill="#607789">傳 LINE 訊息用</text><rect x="425" y="336" width="210" height="30" rx="15" fill="#2f6f7e22"/><text x="530" y="357" font-size="15" font-weight="700" fill="#2f6f7e" text-anchor="middle">小美 = 編號 B789</text><rect x="60" y="450" width="620" height="110" rx="16" fill="#fdecea" stroke="#efc2bb"/><text x="370" y="495" font-size="22" font-weight="700" fill="#b5483a" text-anchor="middle">✕ 同一個小美，編號不一樣</text><text x="370" y="532" font-size="16" fill="#8a3a2f" text-anchor="middle">官方帳號不知道網站上的「A123」是誰，傳不了訊息給她</text><text x="740" y="170" font-size="22" font-weight="700" fill="#18364b">選 A：把網站登入搬進正式資料夾</text><rect x="740" y="220" width="600" height="200" rx="18" fill="#e8f2f4" stroke="#2f6f7e" stroke-width="2" stroke-dasharray="8 6"/><rect x="760" y="202" width="201" height="36" rx="10" fill="#2f6f7e"/><text x="778" y="226" font-size="18" font-weight="700" fill="#fff">📁 出走社（正式）</text><rect x="765" y="260" width="250" height="120" rx="14" fill="#fff" stroke="#dfe7ea" filter="url(#sh)"/><text x="785" y="296" font-size="19" font-weight="700" fill="#18364b">活動接龍網站</text><text x="785" y="322" font-size="14" fill="#607789">登入用</text><rect x="785" y="336" width="210" height="30" rx="15" fill="#2f6f7e22"/><text x="890" y="357" font-size="15" font-weight="700" fill="#2f6f7e" text-anchor="middle">小美 = 編號 B789</text><rect x="1065" y="260" width="250" height="120" rx="14" fill="#fff" stroke="#dfe7ea" filter="url(#sh)"/><text x="1085" y="296" font-size="19" font-weight="700" fill="#18364b">出走社官方帳號</text><text x="1085" y="322" font-size="14" fill="#607789">傳 LINE 訊息用</text><rect x="1085" y="336" width="210" height="30" rx="15" fill="#2f6f7e22"/><text x="1190" y="357" font-size="15" font-weight="700" fill="#2f6f7e" text-anchor="middle">小美 = 編號 B789</text><rect x="740" y="450" width="600" height="110" rx="16" fill="#e5f3ea" stroke="#b7dcc4"/><text x="1040" y="495" font-size="22" font-weight="700" fill="#3d8a5a" text-anchor="middle">✓ 編號一樣，對得起來</text><text x="1040" y="532" font-size="16" fill="#24553a" text-anchor="middle">以後想用官方帳號傳訊息給接龍的人，直接就能做</text><rect x="60" y="600" width="1280" height="220" rx="20" fill="#fff" stroke="#dfe7ea" filter="url(#sh)"/><text x="90" y="645" font-size="22" font-weight="700" fill="#18364b">怎麼選？只要回答一題：</text><text x="90" y="685" font-size="19" fill="#18364b">以後會不會想讓「出走社官方帳號」自動傳 LINE 訊息給參加的社員？（例如成團後提醒付款）</text><rect x="90" y="710" width="580" height="86" rx="14" fill="#e8f2f4"/><text x="112" y="745" font-size="19" font-weight="700" fill="#2f6f7e">可能會 → 選 A（建議）</text><text x="112" y="777" font-size="15" fill="#18364b">現在多花 15 分鐘重建登入；社員完全感覺不到</text><rect x="700" y="710" width="610" height="86" rx="14" fill="#f8f0e5"/><text x="722" y="745" font-size="19" font-weight="700" fill="#a67c35">確定不會 → 沿用測試的</text><text x="722" y="777" font-size="15" fill="#18364b">最省事；但哪天改變主意，所有社員要重新登入、重新審核</text></svg>